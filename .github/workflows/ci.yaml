name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, not just the default shallow clone: the changeset
          # status check below diffs the PR branch against `origin/main`.
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Configure GitHub Packages authentication
        run: pnpm config set --location=user //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        # --ignore-scripts: pnpm 9 runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      # oxlint is provided by the Nix devShell (flake.nix), not a package.json
      # devDependency — see flake.nix's comment on why. Installing Nix just for
      # this one step is the org-wide trade-off (DEPENDENCY_POLICY.md §5
      # "前提条件"): one pinned oxlint version instead of 16 repos each
      # independently drifting on their own npm-resolved version.
      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # oxlint's no-restricted-imports (.oxlintrc.json) is the enforcement
      # mechanism for the Tier4 dependency policy (DEPENDENCY_POLICY.md §5).
      - name: Lint
        run: nix develop --command pnpm lint

      - name: Test
        run: pnpm test

      # RELEASE_STANDARD.md §1.2: catch a user-facing PR that forgot to add a
      # changeset. Only meaningful on a PR (there is nothing to diff against on
      # a push to main itself). Not a perfect filter — a docs-only or
      # CI-only PR will also be flagged — so treat a failure here as a prompt
      # to run `pnpm changeset` (or confirm the change truly needs none),
      # rather than as an unconditional hard requirement.
      - name: Changeset status
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=main

      # 4-metric 99% gate (TEST_STANDARD.md §3), applied immediately and
      # org-wide with no staged rollout. This repository's baseline was
      # unmeasured before this migration; the gate is enabled regardless of
      # what the baseline turned out to be (TEST_STANDARD.md §4 / this repo's
      # migration PR records the real number).
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
