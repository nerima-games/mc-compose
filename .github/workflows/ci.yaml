name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Full history, not just the default shallow clone: the changeset
          # status check below diffs the PR branch against `origin/main`.
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to a commit, not the mutable v4 tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Configure GitHub Packages authentication
        run: pnpm config set --location=user //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        # --ignore-scripts: a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify
        run: pnpm verify

      # RELEASE_STANDARD.md §1.2: catch a user-facing PR that forgot to add a
      # changeset. Only meaningful on a PR (there is nothing to diff against on
      # a push to main itself). Not a perfect filter — a docs-only or
      # CI-only PR will also be flagged — so treat a failure here as a prompt
      # to run `pnpm changeset` (or confirm the change truly needs none),
      # rather than as an unconditional hard requirement.
      - name: Changeset status
        if: github.event_name == 'pull_request'
        # A PR checkout has no local branch literally named `main`, only
        # `origin/main` (found+fixed identically in mc-save, mc-physics):
        # --since=main fails with "Failed to find where HEAD diverged from main".
        run: pnpm changeset status --since=origin/main

      # All four source-coverage metrics are required to reach 100%.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage/
          retention-days: 7
