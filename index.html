<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mc-compose — composed frame</title>
    <link rel="icon" href="data:," />
    <style>
      /* Deliberately minimal. Every colour the HUD and the crosshair use is
         declared by mx-ui's own palette (`declarePalette`), and restating any
         of it here would put token values in a second place — which is the
         failure `mx-ui/domain/palette.ts` is built to make impossible. */
      body {
        margin: 0;
        overflow: hidden;
        background: #101014;
        color: #f0f0f0;
        font: 12px/1.4 monospace;
      }

      #game-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* The HUD and the crosshair are appended here by mx-ui. Positioned rather
         than laid out: mx-ui owns what goes inside, the host owns where it sits. */
      #hud-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      #fps-counter,
      #stage-order,
      #boot-status {
        position: fixed;
        z-index: 20;
        padding: 4px 9px;
        background: rgba(0, 0, 0, 0.55);
        pointer-events: none;
      }

      #fps-counter {
        top: 10px;
        right: 10px;
      }

      #stage-order {
        bottom: 10px;
        left: 10px;
        max-width: calc(100vw - 40px);
        word-break: break-all;
      }

      #boot-status {
        top: 10px;
        left: 10px;
      }

      #boot-status:empty {
        display: none;
      }
    </style>
  </head>
  <body data-mc-compose-boot="starting">
    <!-- THE drawing surface. mc-render's `makeWorldRenderer` creates the WebGL2
         context on it (see apps/web/main.ts); this file still never calls
         getContext, because a context created here would make
         docs/e2e-triage.md #1 pass without mc-render drawing anything. It is
         also the pointer-lock target and the element a click can land on. -->
    <canvas id="game-canvas"></canvas>
    <div id="hud-root"></div>
    <div id="fps-counter">FPS: <span id="fps-value">0</span></div>
    <div id="stage-order" data-stage-count="0"></div>
    <div id="boot-status" role="status" aria-live="polite"></div>
    <script type="module" src="/apps/web/main.ts"></script>
  </body>
</html>
